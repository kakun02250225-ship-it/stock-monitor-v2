name: 毎朝の株価レポートメール

# 毎朝 JST 9:00（UTC 0:00）に自動実行。手動実行(workflow_dispatch)も可能。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: レポートメールを送信
        # スクリプトは標準ライブラリだけで動くので pip install は不要
        env:
          REPORT_API_URL: ${{ secrets.REPORT_API_URL }}
          REPORT_API_TOKEN: ${{ secrets.REPORT_API_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python scripts/send_report.py
