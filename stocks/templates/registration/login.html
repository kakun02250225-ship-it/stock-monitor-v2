{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<h1>ログイン</h1>

{% if form.errors %}
<p style="color: #c44;">ユーザー名かパスワードが間違っています。</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p><button class="btn btn-add" type="submit">ログイン</button></p>
</form>
{% endblock %}
