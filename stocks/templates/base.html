<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}株価モニター v2{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { border-bottom: 2px solid #4a6; padding-bottom: .3rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: .5rem; text-align: left; }
        th { background: #f3f6f3; }
        .btn { display: inline-block; padding: .3rem .7rem; border-radius: 4px; text-decoration: none; font-size: .9rem; }
        .btn-add { background: #4a6; color: #fff; }
        .btn-edit { background: #46a; color: #fff; }
        .btn-del { background: #c44; color: #fff; }
        form p { margin: .8rem 0; }
        label { display: inline-block; min-width: 8rem; font-weight: bold; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
